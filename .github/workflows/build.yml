name: Build applications

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: Build Windows WPF app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish Windows app (self-contained)
        run: dotnet publish windows/WiFiTransfer.App/WiFiTransfer.App.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true --output artifacts/windows
      - name: Upload Windows app
        uses: actions/upload-artifact@v4
        with:
          name: DroidShare-Windows-x64
          path: artifacts/windows/
          if-no-files-found: error
          retention-days: 14

  android:
    name: Build Android app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore GitHub development keystore
        env:
          ANDROID_DEV_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEV_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_DEV_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_DEV_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/droidshare-github-dev.jks"
          else
            echo "GitHub development keystore secret is not configured; using default debug signing."
          fi
      - name: Assemble debug APK
        env:
          ANDROID_DEV_KEYSTORE_PATH: ${{ secrets.ANDROID_DEV_KEYSTORE_BASE64 != '' && format('{0}/droidshare-github-dev.jks', runner.temp) || '' }}
          ANDROID_DEV_STORE_PASSWORD: ${{ secrets.ANDROID_DEV_STORE_PASSWORD }}
          ANDROID_DEV_KEY_ALIAS: ${{ secrets.ANDROID_DEV_KEY_ALIAS }}
          ANDROID_DEV_KEY_PASSWORD: ${{ secrets.ANDROID_DEV_KEY_PASSWORD }}
        run: gradle -p android :app:assembleDebug
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: DroidShare-Android-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  deploy_android:
    name: Install APK on connected Android device
    runs-on: [self-hosted, Windows, X64]
    needs: android
    if: github.event_name != 'pull_request'
    steps:
      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: DroidShare-Android-Debug-APK
          path: artifacts/android

      - name: Discover wireless ADB device and install APK
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          $adb = 'C:\Users\droid\AppData\Local\Android\Sdk\platform-tools\adb.exe'
          $apk = Join-Path $env:GITHUB_WORKSPACE 'artifacts\android\app-debug.apk'

          if (-not (Test-Path $adb)) { throw "ADB not found: $adb" }
          if (-not (Test-Path $apk)) { throw "APK not found: $apk" }

          & $adb start-server
          if ($LASTEXITCODE -ne 0) { throw 'Unable to start ADB server.' }

          # Reuse an already-connected device first. The ADB connect port can
          # change after reboot, so use mDNS only when no device is connected.
          $serial = $null
          $connected = @(& $adb devices | Select-Object -Skip 1 | Where-Object { "$_".Trim() -match '^\S+\s+device
          Write-Host "Installing APK on $serial"
          & $adb -s $serial shell getprop ro.product.model
          if ($LASTEXITCODE -ne 0) { throw 'Unable to communicate with the Android device.' }

          & $adb -s $serial install -r $apk
          if ($LASTEXITCODE -ne 0) { throw 'APK installation failed.' }

          Write-Host "APK installed successfully on $serial"
 })
          if ($connected.Count -eq 1) {
            $serial = ("$($connected[0])".Trim() -split '\s+')[0]
            Write-Host "Using already-connected ADB device: $serial"
          }
          elseif ($connected.Count -gt 1) {
            & $adb devices -l
            throw "Expected one connected ADB device, found $($connected.Count). Disconnect extra devices."
          }

          # If no device is connected, discover the current wireless endpoint.
          for ($attempt = 1; $attempt -le 24 -and -not $serial; $attempt++) {
            Write-Host "Searching for paired wireless Android device (attempt $attempt/24)..."
            $services = & $adb mdns services 2>&1
            foreach ($line in $services) {
              if ("$line" -match '_adb-tls-connect\._tcp' -and "$line" -match '(\d{1,3}(?:\.\d{1,3}){3}:\d+)') {
                $candidate = $Matches[1]
                Write-Host "Discovered wireless ADB endpoint: $candidate"
                & $adb connect $candidate
                if ($LASTEXITCODE -eq 0) {
                  & $adb -s $candidate get-state *> $null
                  if ($LASTEXITCODE -eq 0) { $serial = $candidate; break }
                }
              }
            }
            if (-not $serial) { Start-Sleep -Seconds 5 }
          }

          if (-not $serial) {
            & $adb mdns services
            & $adb devices -l
            throw 'No connected or discoverable paired wireless ADB device found. Check Wireless debugging, mDNS availability, and that both devices are on the same Wi-Fi network.'
          }

          Write-Host "Installing APK on $serial"
          & $adb -s $serial shell getprop ro.product.model
          if ($LASTEXITCODE -ne 0) { throw 'Unable to communicate with the Android device.' }

          & $adb -s $serial install -r $apk
          if ($LASTEXITCODE -ne 0) { throw 'APK installation failed.' }

          Write-Host "APK installed successfully on $serial"
