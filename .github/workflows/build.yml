name: Build applications

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: Build Windows WPF app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish Windows app (self-contained)
        run: dotnet publish windows/WiFiTransfer.App/WiFiTransfer.App.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true --output artifacts/windows
      - name: Upload Windows app
        uses: actions/upload-artifact@v4
        with:
          name: DroidShare-Windows-x64
          path: artifacts/windows/
          if-no-files-found: error
          retention-days: 14

  android:
    name: Build Android app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Assemble debug APK
        run: gradle -p android :app:assembleDebug
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: DroidShare-Android-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  deploy_android:
    name: Install APK on connected Android device
    runs-on: [self-hosted, Windows, X64, droidshare-android]
    needs: android
    if: github.event_name != 'pull_request'
    steps:
      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: DroidShare-Android-Debug-APK
          path: artifacts/android

      - name: Verify ADB device and install APK
        shell: powershell
        run: |
          $adb = "C:\Users\droid\AppData\Local\Android\Sdk\platform-tools\adb.exe"
          $apk = Join-Path $env:GITHUB_WORKSPACE "artifacts\android\app-debug.apk"

          if (-not (Test-Path $adb)) {
            throw "ADB not found at '$adb'. Check Android SDK platform-tools installation."
          }
          if (-not (Test-Path $apk)) {
            throw "APK not found at '$apk'."
          }

          & $adb start-server
          $deviceLines = & $adb devices | Select-Object -Skip 1 | Where-Object { $_ -match '^\S+\s+device(\s|$)' }
          if (@($deviceLines).Count -ne 1) {
            & $adb devices -l
            throw "Expected exactly one authorized ADB device, found $(@($deviceLines).Count)."
          }

          $serial = ($deviceLines[0] -split '\s+')[0]
          Write-Host "Installing APK on device: $serial"
          & $adb -s $serial shell getprop ro.product.model
          if ($LASTEXITCODE -ne 0) { throw "Unable to communicate with ADB device." }

          & $adb -s $serial install -r $apk
          if ($LASTEXITCODE -ne 0) { throw "APK installation failed." }

          Write-Host "APK installed successfully on $serial"
