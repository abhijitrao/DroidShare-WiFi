name: Build applications

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: Build Windows WPF app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish Windows app (self-contained)
        run: dotnet publish windows/WiFiTransfer.App/WiFiTransfer.App.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true --output artifacts/windows
      - name: Upload Windows app
        uses: actions/upload-artifact@v4
        with:
          name: DroidShare-Windows-x64
          path: artifacts/windows/
          if-no-files-found: error
          retention-days: 14

  android:
    name: Build Android app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore GitHub development keystore
        env:
          ANDROID_DEV_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEV_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_DEV_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_DEV_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/droidshare-github-dev.jks"
          else
            echo "GitHub development keystore secret is not configured; using default debug signing."
          fi
      - name: Assemble debug APK
        env:
          ANDROID_DEV_KEYSTORE_PATH: ${{ secrets.ANDROID_DEV_KEYSTORE_BASE64 != '' && format('{0}/droidshare-github-dev.jks', runner.temp) || '' }}
          ANDROID_DEV_STORE_PASSWORD: ${{ secrets.ANDROID_DEV_STORE_PASSWORD }}
          ANDROID_DEV_KEY_ALIAS: ${{ secrets.ANDROID_DEV_KEY_ALIAS }}
          ANDROID_DEV_KEY_PASSWORD: ${{ secrets.ANDROID_DEV_KEY_PASSWORD }}
        run: gradle -p android :app:assembleDebug
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: DroidShare-Android-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  deploy_android:
    name: Install APK on connected Android device
    runs-on: [self-hosted, Windows, X64, droidshare-android]
    needs: android
    if: github.event_name != 'pull_request'
    steps:
      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: DroidShare-Android-Debug-APK
          path: artifacts/android

      - name: Verify ADB device and install APK
        shell: cmd
        run: |
          @echo off
          setlocal EnableExtensions EnableDelayedExpansion
          set "ADB=C:\Users\droid\AppData\Local\Android\Sdk\platform-tools\adb.exe"
          set "APK=%GITHUB_WORKSPACE%\artifacts\android\app-debug.apk"

          if not exist "%ADB%" (
            echo ERROR: ADB not found at "%ADB%"
            exit /b 1
          )
          if not exist "%APK%" (
            echo ERROR: APK not found at "%APK%"
            exit /b 1
          )

          "%ADB%" start-server
          if errorlevel 1 exit /b 1

          set "SERIAL="
          set /a COUNT=0
          for /f "skip=1 tokens=1,2" %%A in ('"%ADB%" devices') do (
            if "%%B"=="device" (
              set "SERIAL=%%A"
              set /a COUNT+=1
            )
          )

          if not "!COUNT!"=="1" (
            "%ADB%" devices -l
            echo ERROR: Expected exactly one authorized ADB device, found !COUNT!.
            exit /b 1
          )

          echo Installing APK on device: !SERIAL!
          "%ADB%" -s !SERIAL! shell getprop ro.product.model
          if errorlevel 1 (
            echo ERROR: Unable to communicate with ADB device.
            exit /b 1
          )

          echo Updating app on !SERIAL! (existing app data will be preserved if signatures match)
          "%ADB%" -s !SERIAL! install -r "%APK%"
          if errorlevel 1 (
            echo ERROR: APK installation failed.
            exit /b 1
          )

          echo APK installed successfully on !SERIAL!
